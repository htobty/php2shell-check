; 对照实验统一的 ini 覆盖，两个版本挂同一份，保证变量只有 PHP 版本
; memory_limit 压到 16M：官方镜像默认 128M，2 万条 header 不足以吃穿，
; 压小之后才能稳定触发 OOM 提前退出路径，也让实验时间可控。
memory_limit = 16M

; post_max_size 必须够大，否则 body 在进入 multipart 解析前就被丢掉，
; 测出来的只是 post_max_size 这道墙
post_max_size = 32M
upload_max_filesize = 16M

; 让 part 数上限显式化，避免依赖各版本内置默认值的差异
max_multipart_body_parts = 1020

; 探测目标本身：109619 已确认路径的入口，这里故意保持开启
session.upload_progress.enabled = 1

; 开着才能让 OOM 文案进入响应体，便于探测器识别；
; 生产环境通常关闭，那时只能看容器日志
display_errors = On
log_errors = On
error_reporting = E_ALL
